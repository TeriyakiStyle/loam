<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#677951"/></marker></defs>
<rect width="1200" height="770" fill="#f6f2e6" rx="12"/>
<g font-family="Arial,sans-serif" fill="#414c38">
<text x="40" y="40" font-size="12" letter-spacing="3">LOAM / GROWING-SYSTEM–PLANT CONTRACT / VERSION 1.2</text>
<text x="40" y="84" font-family="Georgia,serif" font-size="34">Needed. Offered. Taken. Grown. Returned.</text>
<text x="40" y="120" font-size="16">One growing system · shared pools · one simulated day · one atomic host commit</text>
<rect x="40" y="158" width="280" height="260" rx="8" fill="#e1e7d1"/>
<rect x="460" y="158" width="280" height="260" rx="8" fill="#e9dfc7"/>
<rect x="880" y="158" width="280" height="260" rx="8" fill="#e0e8d9"/>
<text x="60" y="195" font-size="20">GROWING SYSTEM</text>
<text x="60" y="230" font-size="15">Deliverable water · litres</text>
<text x="60" y="257" font-size="15">Deliverable N / P / K · game units</text>
<text x="60" y="284" font-size="15">Root support · 0–1</text>
<text x="60" y="326" font-size="14">Run internal processes once.</text>
<text x="60" y="355" font-size="14">Offer without withdrawing.</text>
<text x="60" y="384" font-size="14">Deduct only actual uptake.</text>
<text x="480" y="195" font-size="21">DAILY EXCHANGE</text>
<text x="480" y="230" font-size="15">Quote each slot in stable order.</text>
<text x="480" y="267" font-size="14">Coverage = available / needed</text>
<text x="480" y="297" font-size="14">Growth = least-supported factor</text>
<text x="480" y="327" font-size="14">Taken = demand × growth</text>
<text x="480" y="365" font-size="14">Return system + slot reports.</text>
<text x="480" y="394" font-size="13">Host commits the whole day once.</text>
<text x="900" y="195" font-size="23">PLANT</text>
<text x="900" y="230" font-size="15">Species · phase · age</text>
<text x="900" y="257" font-size="15">Growth points · held N / P / K</text>
<text x="900" y="299" font-size="14">Request this phase's resources.</text>
<text x="900" y="328" font-size="14">Accumulate supported growth.</text>
<text x="900" y="357" font-size="14">Retain acquired nutrient units.</text>
<text x="900" y="394" font-size="13">Never inspect provider internals.</text>
<path d="M325 240H454" stroke="#677951" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="222" font-size="12" text-anchor="middle">offer / support</text>
<path d="M455 350H327" stroke="#677951" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="332" font-size="12" text-anchor="middle">actual taken</text>
<path d="M875 240H747" stroke="#677951" stroke-width="2" marker-end="url(#a)"/>
<text x="810" y="222" font-size="12" text-anchor="middle">phase demand</text>
<path d="M745 350H874" stroke="#677951" stroke-width="2" marker-end="url(#a)"/>
<text x="810" y="332" font-size="12" text-anchor="middle">taken / growth</text>
<rect x="40" y="448" width="1120" height="103" rx="8" fill="#e9e6d7"/>
<text x="60" y="480" font-size="15" font-weight="bold">AT HARVEST · ONE HOST TRANSACTION</text>
<text x="60" y="510" font-size="15">Plant holdings → exported harvest + residue parcel → host-selected receiving module or residue inventory.</text>
<text x="60" y="536" font-size="14">Recipient owns processing. No automatic reservoir return. No second charge and no duplicate parcel.</text>
<text x="40" y="590" font-family="Georgia,serif" font-size="22">90% supported growth after germination → 90% of configured potential yield.</text>
<text x="40" y="625" font-size="13" fill="#777b65">Soil adapter: structure → rootSupport. Future adapters implement the same interface; Plant remains unchanged.</text>
<rect x="40" y="650" width="1120" height="90" rx="8" fill="#e9dfc7"/>
<text x="60" y="679" font-size="15" font-weight="bold">BEFORE NORMAL GROWTH · SEED-FUNDED ESTABLISHMENT</text>
<text x="60" y="704" font-size="14">Seed supplies energy and N/P/K; adapter supplies water and germination support. No external nutrient charge.</text>
<text x="60" y="727" font-size="14">Hydration activates reserves → emergence starts normal growth, or exhausted energy leaves a failed seedling.</text>
</g></svg>
